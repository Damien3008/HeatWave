solver_type: "spectral"
domain:
  Lx: 10.0
  Ly: 10.0
  T: 15.0

discretization:
  Mx: 60
  My: 60
  Nt: 1500

physics:
  gamma: 0.1

initial_condition:
  type: "custom"
  sources: [
    {"x": 2.5, "y": 2.5, "amplitude": 1.0, "width": 0.8},
    {"x": 2.5, "y": 7.5, "amplitude": 1.0, "width": 0.8},
    {"x": 7.5, "y": 2.5, "amplitude": 1.0, "width": 0.8},
    {"x": 7.5, "y": 7.5, "amplitude": 1.0, "width": 0.8}
  ]

boundary_conditions:
  type: "dirichlet"
  dirichlet:
    value: 0.0

visualization:
  type: "animation"
  cmap: "coolwarm"
  figsize: [15, 6]
  levels: 50
  animation:
    fps: 40
    interval: 40
    skip_frames: 3
    filename: "four_sources.gif" 